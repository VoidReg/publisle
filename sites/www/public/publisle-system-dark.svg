<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1060"
  height="750"
  viewBox="0 0 1060 750"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Publisle system overview</title>
  <desc id="description">
    Markdown and JSON become a portable document. A host registry configures
    validation, migration and planning. React or Svelte adapters use host
    renderer registrations to produce static article fragments. The host page
    owns layout, routing and metadata, and activates islands that load host
    interactive modules.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ec8a6d" />
    </marker>
  </defs>
  <style>
    text {
      font-family:
        "Space Grotesk",
        "Inter",
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      fill: #fffdfa;
    }
    .panel {
      fill: #26201e;
      stroke: #574f4b;
      stroke-width: 1.5;
    }
    .card {
      fill: #26201e;
      stroke: #8c847f;
      stroke-width: 1.5;
    }
    .core {
      fill: #3c0d02;
      stroke: #ec8a6d;
      stroke-width: 1.5;
    }
    .heading {
      font-size: 19px;
      font-weight: 650;
    }
    .label {
      font-size: 17px;
      font-weight: 600;
      text-anchor: middle;
    }
    .detail {
      font-size: 15px;
      fill: #d3ccc6;
      text-anchor: middle;
    }
    .edge {
      fill: none;
      stroke: #8c847f;
      stroke-width: 2;
      stroke-linejoin: round;
      marker-end: url(#arrow);
    }
    .edge-label {
      font-size: 14px;
      fill: #d3ccc6;
      text-anchor: middle;
    }
  </style>
  <rect width="1060" height="750" fill="#1a1513" rx="16" />
  <rect class="panel" x="20" y="20" width="1020" height="490" rx="16" />
  <text class="heading" x="48" y="58">Authoring / server / build</text>
  <rect class="panel" x="20" y="550" width="1020" height="180" rx="16" />
  <text class="heading" x="48" y="582">Reader application — host-owned</text>

  <path class="edge" d="M 260 136 H 336" />
  <text class="edge-label" x="300" y="90">import / parse</text>
  <path class="edge" d="M 450 172 V 251" />
  <path class="edge" d="M 700 136 H 620 V 278 H 564" />
  <path class="edge" d="M 450 339 V 396" />
  <path class="edge" d="M 700 297 H 650 V 415 H 564" />
  <path class="edge" d="M 560 436 H 696" />
  <path class="edge" d="M 835 472 V 606" />
  <text class="edge-label" x="874" y="535">publish</text>
  <path class="edge" d="M 700 650 H 564" />
  <text class="edge-label" x="630" y="636">activate</text>
  <path class="edge" d="M 280 650 H 336" />
  <text class="edge-label" x="308" y="636">load</text>

  <rect class="card" x="60" y="100" width="200" height="72" rx="10" />
  <text class="label" x="160" y="130">Markdown / JSON</text>
  <text class="detail" x="160" y="153">Structured payloads</text>

  <rect class="core" x="340" y="100" width="220" height="72" rx="10" />
  <text class="label" x="450" y="130">Portable document</text>
  <text class="detail" x="450" y="153">Versioned semantic blocks</text>

  <rect class="card" x="700" y="100" width="270" height="72" rx="10" />
  <text class="label" x="835" y="130">Host block registry</text>
  <text class="detail" x="835" y="153">Optional profiles / resolver</text>

  <rect class="core" x="340" y="255" width="220" height="84" rx="10" />
  <text class="label" x="450" y="284">Prepare</text>
  <text class="detail" x="450" y="307">Validate / migrate / plan</text>
  <text class="detail" x="450" y="326">Diagnostics + cache identity</text>

  <rect class="card" x="700" y="255" width="270" height="84" rx="10" />
  <text class="label" x="835" y="290">Host renderer registration</text>
  <text class="detail" x="835" y="315">Static + interactive contracts</text>

  <rect class="core" x="340" y="400" width="220" height="72" rx="10" />
  <text class="label" x="450" y="430">React / Svelte adapters</text>
  <text class="detail" x="450" y="453">Compile for the host</text>

  <rect class="core" x="700" y="400" width="270" height="72" rx="10" />
  <text class="label" x="835" y="430">Static article fragment</text>
  <text class="detail" x="835" y="453">Optional island hooks</text>

  <rect class="card" x="700" y="610" width="270" height="84" rx="10" />
  <text class="label" x="835" y="640">Host page</text>
  <text class="detail" x="835" y="665">Layout / routing / metadata</text>

  <rect class="core" x="340" y="610" width="220" height="84" rx="10" />
  <text class="label" x="450" y="640">Interactive islands</text>
  <text class="detail" x="450" y="665">Activate only as requested</text>

  <rect class="card" x="60" y="610" width="220" height="84" rx="10" />
  <text class="label" x="170" y="640">Host interactive modules</text>
  <text class="detail" x="170" y="665">Lazy-loaded implementations</text>
</svg>
