version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/research
      - /deploy/vps/native-runtime
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
      react:
        patterns: [react, react-dom]
      native-pdf:
        patterns: ["@publisle/pdf-native-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
