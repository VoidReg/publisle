name: Finalize published npm release

on:
  workflow_dispatch:
    inputs:
      publication_run:
        description: Original npm publication run with accepted uploads
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Restore original validated artifacts and publication record
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN: ${{ inputs.publication_run }}
        run: |
          [[ "$PUBLICATION_RUN" =~ ^[0-9]+$ ]]
          gh run download "$PUBLICATION_RUN" --name packed-consumer-and-tarballs --dir "$RUNNER_TEMP/original"
          gh run view "$PUBLICATION_RUN" --json headSha,workflowName,jobs > "$RUNNER_TEMP/run.json"
          PROGRESS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_RUN/artifacts" --paginate --slurp | jq -r '[.[].artifacts[] | select(.expired == false) | select(.name | startswith("npm-publication-progress-"))] | sort_by(.id) | last | .name')
          mapfile -t MANIFESTS < <(find "$RUNNER_TEMP/original" -name release-manifest.json)
          test "${#MANIFESTS[@]}" -eq 1
          STAGE=$(dirname "${MANIFESTS[0]}")
          gh run download "$PUBLICATION_RUN" --name "$PROGRESS" --dir "$STAGE"
          RELEASE_MANIFEST="${MANIFESTS[0]}" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const run = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/run.json`));
          const manifest = JSON.parse(readFileSync(process.env.RELEASE_MANIFEST));
          const plan = JSON.parse(readFileSync('.release/plan.json'));
          const record = JSON.parse(readFileSync(process.env.RELEASE_MANIFEST.replace('release-manifest.json', 'publication-record.json')));
          assert.equal(run.workflowName, 'Validate and publish npm packages');
          assert.equal(run.headSha, manifest.sourceCommit);
          assert.equal(manifest.releaseId, plan.id);
          for (const name of ['source', 'check / lint-and-format', 'research / starter-profiles', 'distribution / packed-consumer']) assert(run.jobs.some(job => job.name === name && job.conclusion === 'success'), `Original gate failed: ${name}`);
          assert.deepEqual(record.packages.map(pkg => `${pkg.name}@${pkg.version}`).sort(), plan.releases.map(pkg => `${pkg.name}@${pkg.version}`).sort());
          JS
          echo "manifest=${MANIFESTS[0]}" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .sourceCommit "${MANIFESTS[0]}")" >> "$GITHUB_OUTPUT"
      - name: Verify retained tarballs against immutable registry versions
        env:
          GITHUB_SHA: ${{ steps.original.outputs.commit }}
          RELEASE_MANIFEST: ${{ steps.original.outputs.manifest }}
        run: node tools/npm-release.ts verify "$RELEASE_MANIFEST"
      - name: Recheck fresh registry consumers and showcase
        env:
          GITHUB_SHA: ${{ steps.original.outputs.commit }}
          RELEASE_MANIFEST: ${{ steps.original.outputs.manifest }}
        run: node tools/npm-registry-consumers.ts "$RELEASE_MANIFEST"
      - name: Publish GitHub prerelease and retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.original.outputs.commit }}
          RELEASE_STAGE: ${{ steps.original.outputs.stage }}
        run: |
          TAG=$(node -p "require('./.release/plan.json').id")
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readReleasePlan} from './tools/npm-release.ts';
          for (const pkg of (await readReleasePlan(process.cwd())).releases) {
            const tag = `${pkg.name}@${pkg.version}`;
            const existing = execFileSync('git', ['ls-remote', 'origin', `refs/tags/${tag}`], {encoding:'utf8'}).trim();
            if (existing) {
              if (existing.split(/\s+/u)[0] !== process.env.GITHUB_SHA) throw new Error(`Conflicting tag: ${tag}`);
            } else {
              execFileSync('git', ['tag', tag, process.env.GITHUB_SHA]);
              execFileSync('git', ['push', 'origin', `refs/tags/${tag}`]);
            }
          }
          JS
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            TITLE=$(node -p "require('./.release/plan.json').releases.map((pkg) => pkg.name + ' v' + pkg.version).join(', ')")
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Publisle beta: $TITLE" --prerelease --draft --generate-notes
          fi
          gh release upload "$TAG" "$RELEASE_STAGE"/tarballs/*.tgz "$RELEASE_STAGE/release-manifest.json" "$RELEASE_STAGE/contract-bundle.json" "$RELEASE_STAGE/publication-record.json" "$RELEASE_STAGE/registry-consumers.json" --clobber
          gh release edit "$TAG" --draft=false --prerelease
