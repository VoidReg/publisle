name: Validate and publish npm packages

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact prepared source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Verify source identity and independent release plan
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          node tools/npm-release.ts source

  check:
    needs: source
    uses: ./.github/workflows/check.yml
  research:
    needs: source
    uses: ./.github/workflows/research.yml
  distribution:
    needs: source
    uses: ./.github/workflows/distribution.yml
    with:
      release_plan: true
  publish:
    needs: [check, research, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Install npm with trusted publishing support
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@v8
        with:
          name: packed-consumer-and-tarballs
          path: ${{ runner.temp }}/release
      - name: Locate exact validated tarballs and restore previous upload progress
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t MANIFESTS < <(find "$RUNNER_TEMP/release" -name release-manifest.json)
          test "${#MANIFESTS[@]}" -eq 1
          echo "manifest=${MANIFESTS[0]}" >> "$GITHUB_OUTPUT"
          echo "stage=$(dirname "${MANIFESTS[0]}")" >> "$GITHUB_OUTPUT"
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --slurp --jq '[.[].artifacts[] | select(.expired == false) | select(.name | startswith("npm-publication-progress-"))] | sort_by(.id) | last | .name // empty')
          if [ -n "$PREVIOUS" ]; then
            gh run download "$GITHUB_RUN_ID" --name "$PREVIOUS" --dir "$(dirname "${MANIFESTS[0]}")"
          fi
      - name: Publish missing packages and verify public registry bytes and tags
        env:
          RELEASE_MANIFEST: ${{ steps.artifacts.outputs.manifest }}
        run: node tools/npm-release.ts publish "$RELEASE_MANIFEST"
      - name: Test fresh registry-only Core, Research and showcase consumers
        env:
          RELEASE_MANIFEST: ${{ steps.artifacts.outputs.manifest }}
        run: node tools/npm-registry-consumers.ts "$RELEASE_MANIFEST"
      - name: Publish GitHub prerelease and retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STAGE: ${{ steps.artifacts.outputs.stage }}
        run: |
          TAG=$(node -p "require('./.release/plan.json').id")
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readReleasePlan} from './tools/npm-release.ts';
          for (const pkg of (await readReleasePlan(process.cwd())).releases) {
            const tag = `${pkg.name}@${pkg.version}`;
            const existing = execFileSync('git', ['ls-remote', 'origin', `refs/tags/${tag}`], {encoding:'utf8'}).trim();
            if (existing) {
              if (existing.split(/\s+/u)[0] !== process.env.GITHUB_SHA) throw new Error(`Conflicting tag: ${tag}`);
            } else {
              execFileSync('git', ['tag', tag, process.env.GITHUB_SHA]);
              execFileSync('git', ['push', 'origin', `refs/tags/${tag}`]);
            }
          }
          JS
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Publisle $TAG (beta)" --prerelease --draft --generate-notes
          fi
          gh release upload "$TAG" "$RELEASE_STAGE"/tarballs/*.tgz "$RELEASE_STAGE/release-manifest.json" "$RELEASE_STAGE/contract-bundle.json" "$RELEASE_STAGE/publication-record.json" "$RELEASE_STAGE/registry-consumers.json" --clobber
          gh release edit "$TAG" --draft=false --prerelease
      - uses: actions/upload-artifact@v7
        if: always() && steps.artifacts.outputs.stage != ''
        with:
          name: npm-publication-progress-${{ github.run_attempt }}
          path: |
            ${{ steps.artifacts.outputs.stage }}/accepted-uploads.json
            ${{ steps.artifacts.outputs.stage }}/publication-record.json
            ${{ steps.artifacts.outputs.stage }}/registry-consumers.json
          if-no-files-found: ignore
          retention-days: 90
