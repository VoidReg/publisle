name: Release npm packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare pending independent releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/npm-release.ts prepare
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard .release)"; then
            echo "No pending Changesets; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          else
            pnpm install --lockfile-only --ignore-scripts
            pnpm exec prettier --write packages blocks .changeset .release showcase/fourier/package.json pnpm-lock.yaml
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit release metadata and start validation and publication
        if: steps.plan.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages blocks .changeset .release showcase/fourier/package.json pnpm-lock.yaml
          git commit -m "Prepare independent npm releases"
          git push origin HEAD:main
          RELEASE_COMMIT=$(git rev-parse HEAD)
          gh workflow run npm-publish.yml --ref main -f expected_commit="$RELEASE_COMMIT"
          echo "Prepared release at **$RELEASE_COMMIT**. Follow the [publication workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/npm-publish.yml)." >> "$GITHUB_STEP_SUMMARY"
